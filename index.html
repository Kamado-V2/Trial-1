
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b17">
<title>Verdant Calculator</title>
<style>
*{box-sizing:border-box}
:root{--green:#82ffc2;--bg:#071b17;--glass:rgba(255,255,255,.065)}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;padding:20px 12px;
 font-family:system-ui,-apple-system,sans-serif;color:#f2fff7;
 background:radial-gradient(at 15% 15%,#20523c,transparent 45%),
 radial-gradient(at 90% 90%,#173d36,transparent 45%),var(--bg)
}
.app{width:min(100%,410px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}
.logo{background:linear-gradient(135deg,#b6ffda,#37d995);color:#063321;
 width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:24px;font-weight:900}
h1{font-size:19px;margin:0} .sub{font-size:11px;color:#94b5a6;letter-spacing:1px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.025));
 border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);border-radius:25px;
 box-shadow:0 22px 65px #0005}
.screen{padding:20px;margin-bottom:13px}
.top{display:flex;justify-content:space-between;align-items:center}
.mode{display:flex;background:#0003;border-radius:10px;padding:3px}
.mode button{border:0;background:transparent;color:#8da99b;padding:6px 12px;border-radius:8px;font-size:12px}
.mode button.active{color:var(--green);background:#82ffc21b}
.status{font-size:10px;color:var(--green);letter-spacing:1px}
.expression{margin-top:28px;min-height:28px;text-align:right;color:#9eb9ac;
 font-size:19px;overflow-x:auto;white-space:nowrap}
.result{margin-top:8px;text-align:right;font-size:clamp(35px,10vw,47px);
 font-weight:650;letter-spacing:-1.5px;overflow-x:auto;white-space:nowrap}
.message{min-height:22px;text-align:right;font-size:12px;color:var(--green);margin-top:6px}
.tools{display:flex;justify-content:space-between;border-top:1px solid #ffffff18;
 padding-top:13px;margin-top:15px;font-size:11px;color:#92ac9f}
.tools button{border:0;background:none;color:var(--green);font-size:12px}
.keys{padding:11px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.key{height:53px;border:1px solid #ffffff0b;border-radius:15px;
 color:#f1fff6;background:rgba(255,255,255,.055);font-size:17px;transition:.15s}
.key:active{transform:scale(.94)}
.key:hover{background:#ffffff18}
.fn{color:var(--green);background:#82ffc20c;font-size:13px}
.op{color:#a3ffd0;background:#4bce951a;font-size:21px}
.equal{background:linear-gradient(135deg,#b2ffd6,#37d995);color:#062c1c;
 font-weight:800;font-size:24px;border:0}
.wide{grid-column:span 2}
.panel{display:none;margin-top:12px;padding:17px}
.panel.open{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel-head h2{font-size:15px}
.panel button{color:var(--green);background:none;border:0}
.item{padding:12px 0;border-bottom:1px solid #ffffff17;overflow-wrap:anywhere}
.item small{display:block;color:#91ad9f;margin-bottom:5px}
.item strong{font-size:17px}
.empty{text-align:center;color:#91ad9f;padding:18px;font-size:13px}
footer{text-align:center;color:#698a7b;font-size:10px;letter-spacing:1px;margin-top:17px}
@media(max-width:350px){.keys{gap:5px;padding:8px}.key{height:48px;border-radius:12px;font-size:14px}}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="brand"><div class="logo">V</div><div><h1>Verdant</h1><div class="sub">SMART CALCULATOR</div></div></div>
 <button class="key fn" id="historyToggle" style="height:40px;padding:0 12px">◷ History</button>
</header>

<section class="glass screen">
 <div class="top">
  <div class="mode"><button id="deg" class="active">DEG</button><button id="rad">RAD</button></div>
  <span class="status">● READY</span>
 </div>
 <div id="expression" class="expression">0</div>
 <div id="result" class="result">0</div>
 <div id="message" class="message">Enter a calculation</div>
 <div class="tools"><span id="mem">MEMORY EMPTY</span><button id="copy">Copy result ↗</button></div>
</section>

<section class="glass keys" id="keys">
 <button class="key fn" data-a="clear">AC</button>
 <button class="key fn" data-a="back">⌫</button>
 <button class="key fn" data-v="(">(</button>
 <button class="key fn" data-v=")">)</button>
 <button class="key op" data-v="/">÷</button>

 <button class="key fn" data-v="sin(">sin</button>
 <button class="key fn" data-v="cos(">cos</button>
 <button class="key fn" data-v="tan(">tan</button>
 <button class="key fn" data-v="sqrt(">√</button>
 <button class="key op" data-v="*">×</button>

 <button class="key fn" data-v="log(">log</button>
 <button class="key fn" data-v="ln(">ln</button>
 <button class="key fn" data-v="^2">x²</button>
 <button class="key fn" data-v="^">xʸ</button>
 <button class="key op" data-v="-">−</button>

 <button class="key fn" data-v="pi">π</button>
 <button class="key fn" data-v="e">e</button>
 <button class="key fn" data-v="%">%</button>
 <button class="key" data-v="7">7</button>
 <button class="key op" data-v="+">+</button>

 <button class="key" data-v="8">8</button>
 <button class="key" data-v="9">9</button>
 <button class="key" data-v="4">4</button>
 <button class="key" data-v="5">5</button>
 <button class="key" data-v="6">6</button>

 <button class="key" data-v="1">1</button>
 <button class="key" data-v="2">2</button>
 <button class="key" data-v="3">3</button>
 <button class="key" data-v="0">0</button>
 <button class="key" data-v=".">.</button>

 <button class="key fn" data-a="sign">±</button>
 <button class="key fn" data-a="memory">MS</button>
 <button class="key fn" data-v="ans">Ans</button>
 <button class="key fn" data-a="clear">CE</button>
 <button class="key equal" data-a="equals">=</button>
</section>

<section class="glass panel" id="panel">
 <div class="panel-head"><h2>Calculation history</h2><button id="clearHistory">Clear</button></div>
 <div id="history"><div class="empty">No calculations yet</div></div>
</section>
<footer>PRECISION · SIMPLICITY · SPEED</footer>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let expr="", answer=0, memory=null, angle="DEG", history=[];
let fresh=false;

function fmt(n){
 if(!Number.isFinite(n)) throw Error("Result is out of range");
 if(Math.abs(n)<1e-12)n=0;
 return Number(n.toPrecision(12)).toString();
}

// A small expression parser: it never executes arbitrary JavaScript.
function calc(input){
 const tokens=[];
 let i=0;
 while(i<input.length){
  if(/\s/.test(input[i])){i++;continue}
  const rest=input.slice(i);
  const nm=rest.match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);
  if(nm){tokens.push({t:"n",v:Number(nm[0])});i+=nm[0].length;continue}
  const word=rest.match(/^[a-z]+/i);
  if(word){
   const v=word[0].toLowerCase();
   if(!["sin","cos","tan","sqrt","log","ln","abs","pi","e","ans"].includes(v))
    throw Error("Unknown function");
   tokens.push({t:"w",v});i+=word[0].length;continue
  }
  if("+-*/^()%!".includes(input[i])){tokens.push({t:"o",v:input[i++]});continue}
  throw Error("Invalid character");
 }
 let p=0;
 const peek=()=>tokens[p];
 const eat=v=>{if(!peek()||peek().v!==v)throw Error("Check brackets");p++};
 const angleFactor=()=>angle==="DEG"?Math.PI/180:1;

 function primary(){
  const t=tokens[p++];
  if(!t)throw Error("Incomplete expression");
  let v;
  if(t.t==="n")v=t.v;
  else if(t.v==="("){v=add();eat(")")}
  else if(t.t==="w"){
   if(t.v==="pi")v=Math.PI;
   else if(t.v==="e")v=Math.E;
   else if(t.v==="ans")v=answer;
   else{
    eat("(");const x=add();eat(")");
    if(t.v==="sqrt"&&x<0)throw Error("Negative square root");
    if((t.v==="log"||t.v==="ln")&&x<=0)throw Error("Input must be positive");
    if(t.v==="sin")v=Math.sin(x*angleFactor());
    if(t.v==="cos")v=Math.cos(x*angleFactor());
    if(t.v==="tan"){
     if(Math.abs(Math.cos(x*angleFactor()))<1e-12)throw Error("Undefined tangent");
     v=Math.tan(x*angleFactor())
    }
    if(t.v==="sqrt")v=Math.sqrt(x);
    if(t.v==="log")v=Math.log10(x);
    if(t.v==="ln")v=Math.log(x);
    if(t.v==="abs")v=Math.abs(x);
   }
  }else throw Error("Invalid expression");

  while(peek()&&(peek().v==="%"||peek().v==="!")){
   const op=tokens[p++].v;
   if(op==="%")v/=100;
   else{
    if(v<0||v>170||!Number.isInteger(v))throw Error("Factorial needs an integer from 0 to 170");
    let f=1;for(let j=2;j<=v;j++)f*=j;v=f;
   }
  }
  return v;
 }
 function unary(){
  if(peek()&&peek().v==="+"){p++;return unary()}
  if(peek()&&peek().v==="-"){p++;return -unary()}
  return primaryPower()
 }
 function primaryPower(){
  let v=primary();
  if(peek()&&peek().v==="^"){p++;v=Math.pow(v,unary())}
  return v
 }
 function mul(){
  let v=unary();
  while(peek()){
   const op=peek().v;
   if(op==="*"||op==="/"){
    p++;const r=unary();
    if(op==="/"&&r===0)throw Error("Cannot divide by zero");
    v=op==="*"?v*r:v/r;
   }else if(peek().t==="n"||peek().v==="("||
       (peek().t==="w"&&["sin","cos","tan","sqrt","log","ln","abs","pi","e","ans"].includes(peek().v))){
    v*=unary();
   }else break;
  }
  return v;
 }
 function add(){
  let v=mul();
  while(peek()&&(peek().v==="+"||peek().v==="-")){
   const op=tokens[p++].v,r=mul();
   v=op==="+"?v+r:v-r;
  }
  return v;
 }
 const value=add();
 if(p!==tokens.length)throw Error("Incomplete expression");
 if(!Number.isFinite(value))throw Error("Invalid result");
 return value;
}

function render(){
 $("expression").textContent=expr||"0";
 $("mem").textContent=memory===null?"MEMORY EMPTY":"MEMORY SAVED";
 if(!expr){$("result").textContent="0";$("message").textContent="Enter a calculation";return}
 try{
  $("result").textContent=fmt(calc(expr));
  $("message").textContent="Live calculation";
 }catch(e){
  $("result").textContent="—";
  $("message").textContent=e.message;
 }
}
function insert(v){
 if(fresh){
  if(/[0-9.]/.test(v)&&v.length===1)expr="";
  fresh=false;
 }
 expr+=v;render();
}
function clear(){expr="";fresh=false;render()}
function back(){expr=expr.slice(0,-1);fresh=false;render()}

function equals(){
 if(!expr)return;
 try{
  const original=expr,value=calc(expr),formatted=fmt(value);
  answer=value;
  history.unshift({original,formatted});
  history=history.slice(0,25);
  renderHistory();
  $("expression").textContent=original+" =";
  $("result").textContent=formatted;
  $("message").textContent="Calculated successfully ✓";
  expr=formatted;fresh=true;
 }catch(e){$("message").textContent=e.message}
}
function renderHistory(){
 const box=$("history");box.replaceChildren();
 if(!history.length){box.innerHTML='<div class="empty">No calculations yet</div>';return}
 history.forEach(h=>{
  const row=document.createElement("div");row.className="item";
  const small=document.createElement("small");small.textContent=h.original;
  const strong=document.createElement("strong");strong.textContent=h.formatted;
  const use=document.createElement("button");use.textContent="Use ↗";
  use.style.float="right";
  use.onclick=()=>{expr=h.formatted;fresh=true;render();$("panel").classList.remove("open")};
  row.append(small,strong,use);box.append(row);
 });
}

$("keys").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.v!==undefined){insert(b.dataset.v);return}
 switch(b.dataset.a){
  case "clear":clear();break;
  case "back":back();break;
  case "equals":equals();break;
  case "sign":expr=expr?"-("+expr+")":"-";fresh=false;render();break;
  case "memory":
   try{memory=expr?calc(expr):answer;$("message").textContent="Memory saved"}
   catch{$("message").textContent="Enter a valid calculation"}
   render();break;
 }
});
function setAngle(a){
 angle=a;$("deg").classList.toggle("active",a==="DEG");
 $("rad").classList.toggle("active",a==="RAD");render()
}
$("deg").onclick=()=>setAngle("DEG");
$("rad").onclick=()=>setAngle("RAD");
$("historyToggle").onclick=()=>$("panel").classList.toggle("open");
$("clearHistory").onclick=()=>{history=[];renderHistory()};
$("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText($("result").textContent);
 $("message").textContent="Copied successfully ✓"}
 catch{$("message").textContent="Copy unavailable in this browser"}
};
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(/^[0-9.]$/.test(e.key))insert(e.key);
 else if("+-*/^()%".includes(e.key))insert(e.key);
 else if(e.key==="Enter"||e.key==="="){e.preventDefault();equals()}
 else if(e.key==="Backspace")back();
 else if(e.key==="Escape")clear();
});
render();
</script>
</body>
</html>
